name: Scrape units

# Scheduled unit scrape with a headless browser. Vercel can't render the
# JavaScript leasing sites, so this replaced the scrape-units Vercel crons.
# Stalest buildings first; each run picks up where the last one stopped.

on:
  schedule:
    - cron: "0 8 * * *" # 03:00 US Eastern (standard time)
    - cron: "0 20 * * *" # 15:00 US Eastern (standard time)
  workflow_dispatch:
    inputs:
      limit:
        description: "Max buildings this run"
        default: "60"
      minutes:
        description: "Time budget (minutes)"
        default: "50"

concurrency:
  group: scrape-units
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # tsx is a pinned devDependency installed by `npm ci` above: `npx --yes`
      # fetched whatever version npm served into a job holding these secrets.
      # Inputs go through env and are quoted, never pasted into the script.
      - name: Scrape
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          XAI_BASE_URL: ${{ secrets.XAI_BASE_URL }}
          SCRAPE_LIMIT: ${{ inputs.limit || '60' }}
          SCRAPE_MINUTES: ${{ inputs.minutes || '50' }}
        run: npx tsx scripts/scrape-units-batch.ts --limit "$SCRAPE_LIMIT" --minutes "$SCRAPE_MINUTES"

      # Tell Bing which building pages changed so they're recrawled within
      # hours (ChatGPT search leans on Bing's index). Runs even when the scrape
      # step failed partway: whatever it did update is still worth announcing.
      # 120-minute window covers the scrape's 50-minute budget plus slack.
      - name: Notify IndexNow
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/indexnow-submit.ts --since-minutes 120
