<style>

<div class="stc-panel" id="stc-panel" role="dialog" aria-label="Chat with Stacy">
  <div class="stc-head"><div><b>Stacy · AI apartment assistant</b><small>Staycio, independent of the building and its leasing office</small></div><button class="stc-x" type="button" aria-label="Close chat">×</button></div>

</div>
<script>
(function(){
  var D={{DOMAIN_JSON}},EP="https://staycio.com/api/microsite-chat",GREET={{GREETING_JSON}};
  var root=document.getElementById("stc"),panel=document.getElementById("stc-panel");
  // Deliberately not a form element: each page has exactly one form, and its lead handler binds
  // to the first one it finds.
  var log=panel.querySelector(".stc-log"),input=panel.querySelector(".stc-form input"),sendBtn=panel.querySelector(".stc-form button");
  var openBtn=root.querySelector(".stc-chat"),msgs=[],busy=false,started=false;
  function track(n,p){try{window.__scTrack&&window.__scTrack(n,p||{});}catch(e){}}
  function sid(){var k="stc_sid",v=null;try{v=sessionStorage.getItem(k);}catch(e){}
    if(!v){v=(Date.now().toString(36)+Math.random().toString(36).slice(2,10)).replace(/[^a-z0-9]/g,"");try{sessionStorage.setItem(k,v);}catch(e){}}return v;}
  function add(cls,text){var d=document.createElement("div");d.className="stc-m "+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
  // The launchers step aside (.stc-away) for as long as any reason holds.
  var away={};
  function setAway(k,v){if(!!away[k]===!!v)return;away[k]=!!v;var on=false;for(var r in away)if(away[r])on=true;root.classList.toggle("stc-away",on);}
  // They must never cover a primary button or the lead form (on phones they sat on the hero CTA and
  // the phone field), nor sit over the footer at the very bottom. The observer's root is shrunk to
  // the launchers' own box, so they only hide while one of these actually passes underneath.
  var guards=[].slice.call(document.querySelectorAll(".hero .btn,.midcta .btn,form[data-lead],footer")),under=[],io=null,rq=0;
  function watch(){
    if(!window.IntersectionObserver||!guards.length)return;
    if(io)io.disconnect();under=[];
    var cs=getComputedStyle(root),pad=10,rt=parseFloat(cs.right)||0,bt=parseFloat(cs.bottom)||0;
    var m=[innerHeight-bt-root.offsetHeight-pad,rt-pad,bt-pad,innerWidth-rt-root.offsetWidth-pad].map(function(n){return -Math.max(0,Math.round(n))+"px";});
    io=new IntersectionObserver(function(es){es.forEach(function(e){var i=under.indexOf(e.target);
      if(e.isIntersecting){if(i<0)under.push(e.target);}else if(i>-1)under.splice(i,1);});setAway("cover",under.length>0);},{rootMargin:m.join(" ")});
    guards.forEach(function(g){io.observe(g);});
  }

  addEventListener("resize",function(){cancelAnimationFrame(rq);rq=requestAnimationFrame(watch);});
  // A focused field means the iOS keyboard is up and the launchers would ride on top of it.
  function field(t){return !!t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)&&!panel.contains(t);}
  document.addEventListener("focusin",function(e){if(field(e.target))setAway("focus",true);});
  document.addEventListener("focusout",function(){setTimeout(function(){setAway("focus",field(document.activeElement));},0);});

  // viewport, so size the sheet to that, or its header and close button scroll off the top.
  var vv=window.visualViewport;
  function fit(){var s=panel.style;
    if(!vv||!panel.classList.contains("open")||innerWidth>520||vv.scale>1.01){s.top=s.height="";return;}
    s.top=Math.round(vv.offsetTop+8)+"px";s.height=Math.max(240,Math.round(vv.height-16))+"px";}
  if(vv){vv.addEventListener("resize",fit);vv.addEventListener("scroll",fit);}
  function toggle(open){panel.classList.toggle("open",open);openBtn.setAttribute("aria-expanded",open?"true":"false");setAway("panel",open);fit();
    if(open){if(!started){started=true;add("a",GREET);}track("chat_open");setTimeout(function(){input.focus();},50);}}
  openBtn.addEventListener("click",function(){toggle(!panel.classList.contains("open"));});
  panel.querySelector(".stc-x").addEventListener("click",function(){toggle(false);});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&panel.classList.contains("open"))toggle(false);});
  root.querySelector(".stc-call").addEventListener("click",function(){track("call_click",{where:"floating"});});
  panel.querySelector(".stc-foot a").addEventListener("click",function(){track("call_click",{where:"chat"});});
  input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.isComposing){e.preventDefault();send();}});
  sendBtn.addEventListener("click",send);
  function send(){
    var q=input.value.trim();if(!q||busy)return;

      .then(function(d){var t=(d&&(d.reply||d.error))||"Sorry, something went wrong.";typing.remove();add("a",t);if(d&&d.reply)msgs.push({role:"assistant",content:d.reply});})
      .catch(function(){typing.remove();add("a","I can't connect right now. Call {{PHONE_DISPLAY}} or use the form on this page.");})
      .then(function(){busy=false;sendBtn.disabled=false;input.focus();});
  }
})();
</script>
